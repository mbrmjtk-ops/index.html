<!-- =========================
     صفحة النتيجة
     ========================= -->

<div id="resultPage" style="display:none">

<header class="header">

    <h1>نتيجة امتحان</h1>

    <p id="resultCertificate">
        الثانوي - علمي - منهاج إدلب | 2026
    </p>

</header>

<main class="page">


<!-- =========================
     معلومات الطالب
     ========================= -->

<div class="card">

<div class="info">

<div class="right">

    <div class="label">
        اسم الطالب
    </div>

    <div class="value" id="studentName">
        -
    </div>

</div>

<div class="left">

    <div class="label">
        الرقم الامتحاني
    </div>

    <div class="value" id="studentExamNo">
        -
    </div>

</div>

</div>

</div>


<!-- =========================
     المعدل والنجاح
     ========================= -->

<div class="card">

<div class="summary">

    <div class="success-box">

        <div class="success-badge">
            ✓
        </div>

        <span id="resultStatus">
            ناجح
        </span>

    </div>


    <div class="total">

        <div class="label">
            المجموع العام
        </div>

        <div>
            <b id="studentTotal">0</b>
            /
            <span id="studentMax">0</span>
        </div>

        <div class="circle" id="studentPercentage">
            0%
        </div>

    </div>

</div>

</div>


<!-- =========================
     جدول العلامات
     ========================= -->

<div class="table-wrap">

<table>

<thead>

<tr>
    <th>المادة</th>
    <th>الدنيا</th>
    <th>العظمى</th>
    <th>النهائية</th>
</tr>

</thead>

<tbody id="marksTable">

</tbody>

</table>

</div>


<button class="back" onclick="backToSearch()">
    ← العودة للاستعلام
</button>

</main>

</div>


<script>

/* =========================
   بيانات النتائج
   ========================= */

const demoResults = {

    "575294": {

        name: "عبد الرحمن خالد الطويل",

        examNo: "575294",

        certificate: "الثانوي - علمي - منهاج إدلب | 2026",

        total: "1809",

        max: "2400",

        percentage: "75.40%",

        status: "ناجح",

        subjects: [

            ["اللغة العربية", "160", "400", "333"],

            ["الرياضيات", "240", "600", "240"],

            ["الفيزياء", "160", "400", "229"],

            ["التربية الدينية", "80", "200", "165"],

            ["الكيمياء", "80", "200", "151"],

            ["علم الأحياء", "120", "300", "151"],

            ["اللغة الإنكليزية", "120", "300", "165"],

            ["لغة فرنسية", "120", "300", "157"]

        ]

    },


    "1731940": {

        name: "خالد حسين الطويل",

        examNo: "1731940",

        certificate: "الثانوي - أدبي - منهاج إدلب | 2026",

        total: "1592",

        max: "2200",

        percentage: "72.36%",

        status: "ناجح",

        subjects: [

            ["اللغة العربية", "300", "600", "473"],

            ["الجغرافيا", "120", "300", "248"],

            ["الفلسفة والعلوم الإنسانية", "160", "400", "200"],

            ["التاريخ", "120", "300", "180"],

            ["التربية الدينية", "80", "200", "178"],

            ["اللغة الإنجليزية", "160", "400", "313"],

            ["لغة فرنسية", "160", "400", "266"]

        ]

    }

};


/* =========================
   إظهار النتيجة
   ========================= */

function showResult(){

    const n =
        document.getElementById('examNo').value.trim();

    const result = demoResults[n];

    if(!result){

        alert("لا توجد نتيجة لهذا الرقم");

        return;

    }


    /* إخفاء صفحة البحث */

    document.getElementById('searchPage').style.display =
        'none';


    /* إظهار صفحة النتيجة */

    document.getElementById('resultPage').style.display =
        'block';


    /* البيانات الأساسية */

    document.getElementById('studentName').textContent =
        result.name;

    document.getElementById('studentExamNo').textContent =
        result.examNo;

    document.getElementById('resultCertificate').textContent =
        result.certificate;


    /* المجموع */

    document.getElementById('studentTotal').textContent =
        result.total;

    document.getElementById('studentMax').textContent =
        result.max;

    document.getElementById('studentPercentage').textContent =
        result.percentage;

    document.getElementById('resultStatus').textContent =
        result.status;


    /* =========================
       بناء جدول العلامات
       ========================= */

    const table =
        document.getElementById('marksTable');

    table.innerHTML = "";


    result.subjects.forEach(function(subject){

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${subject[0]}</td>

            <td>${subject[1]}</td>

            <td>${subject[2]}</td>

            <td>${subject[3]}</td>

        `;

        table.appendChild(row);

    });


    window.scrollTo(0,0);

}


/* =========================
   العودة لصفحة البحث
   ========================= */

function backToSearch(){

    document.getElementById('resultPage').style.display =
        'none';

    document.getElementById('searchPage').style.display =
        'block';

    window.scrollTo(0,0);

}

</script>
