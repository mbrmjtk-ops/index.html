<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة X O</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#101827,#18263d);
    color:white;
}

.game{
    width:92%;
    max-width:420px;
    text-align:center;
    padding:25px;
    border-radius:25px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    backdrop-filter:blur(15px);
}

h1{
    font-size:38px;
    margin-bottom:8px;
}

.subtitle{
    color:#aebbd0;
    margin-bottom:20px;
}

.score{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}

.score div{
    flex:1;
    padding:12px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
}

.score span{
    display:block;
    font-size:25px;
    font-weight:bold;
    margin-top:5px;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.cell{
    aspect-ratio:1;
    border:0;
    border-radius:18px;
    background:#202f47;
    color:white;
    font-size:55px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    background:#293c59;
    transform:scale(1.03);
}

.cell.x{
    color:#55d6ff;
}

.cell.o{
    color:#ff6b9d;
}

.cell.win{
    animation:win .6s infinite alternate;
    box-shadow:0 0 25px rgba(255,255,255,.5);
}

@keyframes win{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

.status{
    min-height:30px;
    margin:20px 0 15px;
    font-size:18px;
    font-weight:bold;
}

button.restart{
    width:100%;
    border:0;
    padding:15px;
    border-radius:15px;
    background:#55d6ff;
    color:#07111e;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button.restart:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

.mode{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.mode button{
    flex:1;
    padding:10px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    background:#263751;
    color:white;
}

.mode button.active{
    background:#55d6ff;
    color:#07111e;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="game">

    <h1>❌ X O ⭕</h1>

    <p class="subtitle">
        لعبة XO
    </p>

    <div class="mode">

        <button id="pvp" class="active">
            👥 لاعبين
        </button>

        <button id="cpu">
            🤖 ضد الكمبيوتر
        </button>

    </div>

    <div class="score">

        <div>
            ❌ أبو حسين
            <span id="scoreX">0</span>
        </div>

        <div>
            تعادل
            <span id="scoreDraw">0</span>
        </div>

        <div>
            ⭕ أبو خالد
            <span id="scoreO">0</span>
        </div>

    </div>

    <div class="board" id="board"></div>

    <div class="status" id="status">
        دور اللاعب ❌
    </div>

    <button class="restart" onclick="newGame()">
        🔄 لعبة جديدة
    </button>

</div>

<script>

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

let board = [
    "","","",
    "","","",
    "","",""
];

let currentPlayer = "X";

let gameOver = false;

let computerMode = false;

let scoreX = 0;
let scoreO = 0;
let scoreDraw = 0;

const winningLines = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];


function createBoard(){

    boardElement.innerHTML = "";

    board.forEach((value,index)=>{

        const cell =
            document.createElement("button");

        cell.className = "cell";

        if(value === "X"){
            cell.textContent = "❌";
            cell.classList.add("x");
        }

        if(value === "O"){
            cell.textContent = "⭕";
            cell.classList.add("o");
        }

        cell.onclick = () => play(index);

        boardElement.appendChild(cell);

    });
}


function play(index){

    if(gameOver)
        return;

    if(board[index] !== "")
        return;

    if(computerMode && currentPlayer === "O")
        return;


    board[index] = currentPlayer;

    createBoard();


    const result = checkWinner();


    if(result){

        finishGame(result);

        return;
    }


    currentPlayer =
        currentPlayer === "X"
        ? "O"
        : "X";


    updateStatus();


    if(
        computerMode &&
        currentPlayer === "O"
    ){

        setTimeout(computerMove,400);

    }

}


function computerMove(){

    if(gameOver)
        return;


    let available =
        board
        .map((value,index)=>
            value === ""
            ? index
            : null
        )
        .filter(index =>
            index !== null
        );


    if(available.length === 0)
        return;


    let move =
        findBestMove("O");


    if(move === null){

        move =
            findBestMove("X");

    }


    if(
        move === null &&
        board[4] === ""
    ){

        move = 4;

    }


    if(move === null){

        move =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];

    }


    board[move] = "O";

    createBoard();


    const result =
        checkWinner();


    if(result){

        finishGame(result);

        return;

    }


    currentPlayer = "X";

    updateStatus();

}


function findBestMove(player){

    for(let line of winningLines){

        const values =
            line.map(i => board[i]);


        const countPlayer =
            values.filter(
                v => v === player
            ).length;


        const empty =
            line.find(
                i => board[i] === ""
            );


        if(
            countPlayer === 2 &&
            empty !== undefined
        ){

            return empty;

        }

    }

    return null;
}


function checkWinner(){

    for(let line of winningLines){

        const [a,b,c] = line;


        if(
            board[a] &&
            board[a] === board[b] &&
            board[a] === board[c]
        ){

            return {

                winner:board[a],

                line:line

            };

        }

    }


    if(
        board.every(
            cell => cell !== ""
        )
    ){

        return {

            winner:"draw",

            line:[]

        };

    }


    return null;

}


function finishGame(result){

    gameOver = true;


    if(result.winner === "draw"){

        scoreDraw++;


        document.getElementById(
            "scoreDraw"
        ).textContent = scoreDraw;


        statusElement.textContent =
            "🤝 تعادل!";

    }


    else if(result.winner === "X"){

        scoreX++;


        document.getElementById(
            "scoreX"
        ).textContent = scoreX;


        statusElement.textContent =
            "🎉 مبروك أبو حسين ❤️";

    }


    else{

        scoreO++;


        document.getElementById(
            "scoreO"
        ).textContent = scoreO;


        statusElement.textContent =
            "🎉 مبروك أبو خالد ❤️";

    }


    result.line.forEach(index => {

        boardElement
            .children[index]
            .classList.add("win");

    });

}


function updateStatus(){

    if(currentPlayer === "X"){

        statusElement.textContent =
            "دور أبو حسين ❌";

    }

    else{

        statusElement.textContent =
            computerMode
            ? "🤖 الكمبيوتر يفكر..."
            : "دور أبو خالد ⭕";

    }

}


function newGame(){

    board = [
        "","","",
        "","","",
        "","",""
    ];


    currentPlayer = "X";

    gameOver = false;


    createBoard();

    updateStatus();

}


document.getElementById("pvp").onclick =
function(){

    computerMode = false;


    this.classList.add("active");


    document
        .getElementById("cpu")
        .classList.remove("active");


    newGame();

};


document.getElementById("cpu").onclick =
function(){

    computerMode = true;


    this.classList.add("active");


    document
        .getElementById("pvp")
        .classList.remove("active");


    newGame();

};


createBoard();

</script>

</body>
</html>
