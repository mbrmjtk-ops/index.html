<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عمو أبو خالد ❤️</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Tahoma,Arial,sans-serif;
    background:#05070d;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,#14243b,#05070d 65%);
    transition:1s;
}

.light{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:#00c8ff;
    filter:blur(100px);
    opacity:.08;
    transition:1s;
}

.card{
    position:relative;
    z-index:5;
    width:90%;
    max-width:430px;
    padding:45px 25px;
    text-align:center;
    border-radius:30px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.icon{
    font-size:80px;
    margin-bottom:20px;
    transition:.5s;
}

h1{
    font-size:30px;
    line-height:1.5;
    margin-bottom:12px;
}

p{
    color:#9eabc0;
    font-size:16px;
}

.status{
    margin-top:25px;
    padding:12px;
    border-radius:15px;
    background:rgba(255,255,255,.06);
    color:#aebbd0;
}

/* عند الشحن */

.charging .bg{
    background:
        radial-gradient(circle at center,#064d61,#05070d 70%);
}

.charging .light{
    opacity:.55;
    transform:scale(1.4);
}

.charging .icon{
    animation:pulse 1s infinite alternate;
    filter:drop-shadow(0 0 25px #00eaff);
}

.charging h1{
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #00c8ff;
}

.charging .status{
    color:#00eaff;
    border:1px solid rgba(0,234,255,.3);
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15);
    }
}

/* الشرارات */

.spark{
    position:fixed;
    width:5px;
    height:5px;
    background:#00eaff;
    border-radius:50%;
    pointer-events:none;
    animation:fly 2s linear forwards;
}

@keyframes fly{
    from{
        transform:translateY(0) scale(1);
        opacity:1;
    }
    to{
        transform:translateY(-250px) scale(0);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="light"></div>

<div class="card">

    <div class="icon" id="icon">
        🔌
    </div>

    <h1 id="message">
        عاشت إيدك عمو أبو خالد ❤️
    </h1>

    <p id="sub">
        وصّل الشاحن وخلي الباقي علينا 😎
    </p>

    <div class="status" id="status">
        جاري التحقق من حالة الشحن...
    </div>

</div>


<script>

const body = document.body;

const icon =
document.getElementById("icon");

const message =
document.getElementById("message");

const sub =
document.getElementById("sub");

const status =
document.getElementById("status");


function charging(){

    body.classList.add("charging");

    icon.textContent = "⚡🔋";

    message.textContent =
        "عاشت إيدك عمو أبو خالد ❤️";

    sub.textContent =
        "الشاحن وصل... دير بالك لا تكهربنا 😂";

    status.textContent =
        "⚡ الهاتف قيد الشحن";

    createSparks();

}


function notCharging(){

    body.classList.remove("charging");

    icon.textContent = "🔌";

    message.textContent =
        "عاشت إيدك عمو أبو خالد ❤️";

    sub.textContent =
        "وصّل الشاحن وخلي الباقي علينا 😎";

    status.textContent =
        "🔋 الهاتف غير متصل بالشاحن";

}


function createSparks(){

    for(let i=0;i<20;i++){

        const spark =
            document.createElement("div");

        spark.className = "spark";

        spark.style.left =
            Math.random()*100 + "vw";

        spark.style.top =
            (50 + Math.random()*40) + "vh";

        spark.style.animationDelay =
            Math.random()*1.5 + "s";

        document.body.appendChild(spark);

        setTimeout(()=>{
            spark.remove();
        },2500);

    }

}


/*
    فحص حالة البطارية
*/

if("getBattery" in navigator){

    navigator.getBattery().then(
        battery => {

            function update(){

                if(battery.charging){

                    charging();

                }else{

                    notCharging();

                }

            }

            update();

            battery.addEventListener(
                "chargingchange",
                update
            );

        }
    );

}else{

    status.textContent =
        "⚠️ المتصفح لا يدعم اكتشاف الشحن";

}

</script>

</body>
</html>
