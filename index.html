<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاستعلام عن النتائج - نموذج تجريبي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f6;color:#171717;font-family:Tahoma,Arial,sans-serif}
.header{height:255px;background:linear-gradient(135deg,#087a73,#07564f);border-radius:0 0 55px 55px;color:#fff;text-align:center;padding:78px 20px 20px}
.header h1{font-size:34px;margin:0 0 22px;font-weight:800}
.header p{font-size:22px;margin:0;line-height:1.6}
.demo{display:inline-block;margin-top:13px;background:#ffffff;color:#08736c;padding:5px 13px;border-radius:15px;font-size:12px;font-weight:bold}
.panel{max-width:650px;min-height:1100px;margin:25px auto 0;background:#fff;border-radius:42px;border-top:7px solid #d8d7b1;padding:36px 28px 70px;box-shadow:0 1px 5px #0000000a}
.field{margin-bottom:28px}
label{display:block;text-align:right;font-size:24px;font-weight:bold;margin:0 8px 12px}
select,input{width:100%;height:102px;border:2px solid #8ca7a4;border-radius:23px;background:#fff;padding:0 25px;font-size:25px;font-family:inherit;color:#222;outline:none;appearance:auto}
input::placeholder{color:#d1d1d1}
.buttons{margin-top:12px}
button{width:100%;height:88px;border:0;border-radius:22px;background:linear-gradient(135deg,#006b63,#087d75);color:#fff;font-family:inherit;font-size:27px;cursor:pointer;margin-bottom:20px;box-shadow:0 4px 8px #00000018}
.result{display:none;margin-top:30px;border:2px solid #dce8e5;border-radius:24px;padding:22px;text-align:center}
.result h2{color:#08766e;margin:0 0 10px}
.note{font-size:13px;color:#777;text-align:center;margin-top:25px}
@media(max-width:600px){
.header{height:255px;padding-top:78px}
.header h1{font-size:29px}.header p{font-size:19px}
.panel{margin:25px 28px 0;padding:35px 28px;min-height:1050px}
label{font-size:21px}
select,input{height:94px;font-size:22px}
button{font-size:24px;height:84px}
}
</style>
</head>
<body>
<header class="header">
  <h1>الاستعلام عن النتائج</h1>
  <p>أدخل البيانات المطلوبة للبحث عن النتيجة الامتحانية</p>
  <span class="demo">نموذج تجريبي - غير رسمي</span>
</header>

<main class="panel">
  <div class="field">
    <label>السنة الدراسية</label>
    <select id="year">
      <option>2026 - 2025</option>
      <option>2025 - 2024</option>
      <option>2024 - 2023</option>
    </select>
  </div>

  <div class="field">
    <label>المحافظة</label>
    <select id="province">
      <option>حلب</option>
      <option>إدلب</option>
      <option>دمشق</option>
      <option>ريف دمشق</option>
      <option>حمص</option>
      <option>حماة</option>
      <option>اللاذقية</option>
      <option>طرطوس</option>
      <option>دير الزور</option>
      <option>الرقة</option>
      <option>الحسكة</option>
      <option>درعا</option>
      <option>السويداء</option>
      <option>القنيطرة</option>
    </select>
  </div>

  <div class="field">
    <label>الشهادة</label>
    <select id="certificate">
      <option>الثانوي - علمي - منهاج دمشق</option>
      <option>الثانوي - علمي - منهاج حلب</option>
      <option>الثانوي - أدبي</option>
      <option>التعليم الأساسي</option>
      <option>الثانوية المهنية</option>
    </select>
  </div>

  <div class="field">
    <label>رقم الاكتتاب</label>
    <input id="examNo" type="text" inputmode="numeric" maxlength="10" placeholder="123456">
  </div>

  <div class="buttons">
    <button onclick="searchResult()">⌕ &nbsp; استعلام عن النتيجة</button>
    <button onclick="topStudents()">★ &nbsp; الطلاب الأوائل</button>
  </div>

  <div class="result" id="result">
    <h2>نتيجة تجريبية</h2>
    <div id="resultText"></div>
  </div>

  <p class="note">هذه الصفحة نموذج تجريبي وليست موقع نتائج رسمي.</p>
</main>

<script>
function searchResult(){
  const no=document.getElementById('examNo').value.trim();
  const box=document.getElementById('result');
  const text=document.getElementById('resultText');
  if(no==='575294'){
    box.style.display='block';
    text.innerHTML='<b>عبد الرحمن خالد الطويل</b><br>ناجح<br><br>المجموع: 1809 / 2400<br>المعدل: 75.40%';
  }else{
    box.style.display='block';
    text.innerHTML='يرجى إدخال رقم اكتتاب تجريبي صحيح.';
  }
}
function topStudents(){
  alert('قسم الطلاب الأوائل تجريبي.');
}
</script>
</body>
</html>
